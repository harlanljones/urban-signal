[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urban-signal"
version = "2.0.0"
description = "Urban Signal — Real-Time Spatial Intelligence & Commercial Catalyst Forecasting Engine via High-Velocity Municipal Ingestion, H3 Indexing, Kafka Streaming, and Multi-Horizon ONNX Inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Harlan Jones" }
]
keywords = [
    "geospatial",
    "spatial-intelligence",
    "urban-planning",
    "h3",
    "machine-learning",
    "fastapi",
    "kafka",
    "onnx",
    "postgis",
    "catalyst-forecasting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0,<0.28.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.4",
    "h3>=3.7.6",
    "duckdb>=1.0.0",
    "polars>=0.20.30",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "xlrd>=2.0.1",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "torch>=2.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "shap>=0.45.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.4",
    "minio>=7.2.7",
    "prometheus-client>=0.20.0",
    "structlog>=24.2.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
markers = [
    "interlock: fast spine-invariant gate run before releasing the interlock (pytest -m interlock)",
    "live: live-probe tests that hit external APIs (excluded from normal CI runs)",
]
