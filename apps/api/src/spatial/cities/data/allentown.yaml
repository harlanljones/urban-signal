    id_col: null
    select: OBJECTID,WARDACCTNO,PIN,PARNUM,XINSTNUM,SYEAR,SMON,SPRICE,PROPERTYADDR,ZIP
    fallback_endpoints: []
    where: SYEAR >= 1900 AND SMON <> '00' AND SMON <> ''
    needs_geocode: false
    geocode_context: null
    field_map:
      doc_id:
      - XINSTNUM
      - WARDACCTNO
      bbl:
      - PIN
      document_amount:
