datasets:
  permits:
    endpoint: https://services1.arcgis.com/WUqVDRuvIiIiH2Pl/arcgis/rest/services/EnerGov_Building_Permits_Current/FeatureServer/0
    platform: arcgis
    watermark_col: ISSUEDATE
    id_keys:
    - PERMITNUMBER
    topic: raw.municipal.permits
    interval_seconds: 21600.0
    producer_key: permits
    order_by: ISSUEDATE DESC, PERMITNUMBER DESC
    select: OBJECTID,PERMITNUMBER,WORKCLASS,APPLYDATE,ISSUEDATE,STATUSNAME,ADDRESSLINE1,PREDIRECTION,ADDRESSLINE2,STREETTYPE,POSTDIRECTION,POSTALCODE,PARCELNUMBER
    where: ISSUEDATE >= CURRENT_DATE - INTERVAL '90' DAY AND ISSUEDATE <= CURRENT_TIMESTAMP
    needs_geocode: false
    field_map:
      job_id:
      - PERMITNUMBER
      issuance_date:
      - ISSUEDATE
      filing_date:
      - APPLYDATE
      job_type:
      - WORKCLASS
      status:
      - STATUSNAME
      address_street:
      - address_street
      - ADDRESSLINE2
      zipcode:
      - POSTALCODE
      bbl:
      - PARCELNUMBER
    ingestion_mode: snapshot
    oid_field: OBJECTID
    max_record_count: 2000
    expected_cadence_days: 3
    batch_limit: 2000
  deeds:
    endpoint: https://services1.arcgis.com/WUqVDRuvIiIiH2Pl/arcgis/rest/services/Tax_Parcels_Assessed_2022/FeatureServer/0
