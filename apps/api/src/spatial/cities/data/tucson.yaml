    watermark_format: null
    watermark_exclude: []
    order_by: DT_START DESC
    id_col: null
    select: null
    fallback_endpoints: []
    where: DT_START <= CURRENT_TIMESTAMP
    needs_geocode: true
    geocode_context: Tucson, AZ
    field_map:
      license_id:
      - ACC_NUM
      dba:
      - ACC_NAME
      premises_name:
      - ACC_NAME
      license_type:
      - LIC_TYPE
      - NAIC_DESC
      status:
      - LIC_STATUS
      effective_date:
      - DT_START
      address_street:
      - FULLADDRESS
      zipcode:
      - ZIP_CODE
    ingestion_mode: snapshot
    oid_field: OBJECTID
    max_record_count: 2000
    expected_cadence_days: 30
    alarm_exempt: true
    alarm_exempt_reason: 'slow/annual effective cadence: newest non-future DT_START
      rows land ~2 per 60d (layer IS maintained - future-dated applications present);
      DT_START<=CURRENT_TIMESTAMP where guard excludes future sentinels; alarm would
      false-positive on the slow issuance pace'
