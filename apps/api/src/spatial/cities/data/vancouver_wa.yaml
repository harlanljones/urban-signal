datasets:
  permits:
    endpoint: https://services.arcgis.com/oNvpY90qsPDizwkN/arcgis/rest/services/Permits_and_Code_Enforcement_Data_(public_view)/FeatureServer/0
    platform: arcgis
    watermark_col: csm_issued_date
    id_keys:
    - CSM_CASENO
    - sn
    - OBJECTID
    topic: raw.municipal.permits
    interval_seconds: 300.0
    producer_key: permits
    expected_cadence_days: 1
    needs_geocode: true
    geocode_context: Vancouver, WA
    oid_field: OBJECTID
    max_record_count: 2000
    order_by: csm_issued_date DESC
    where: csm_issued_date <= CURRENT_TIMESTAMP
    field_map:
      job_id:
      - CSM_CASENO
      - sn
      - OBJECTID
      issuance_date:
      - csm_issued_date
      status:
      - CSM_STATUS
      job_type:
      - worktype
      - cst_description
      address_street:
      - PRIM_ADDR
      proposed_units:
      - CSM_NO_UNITS
    endpoint_by_year: {}
    watermark_type: null
    watermark_format: null
    watermark_exclude: []
    id_col: null
    select: null
    fallback_endpoints: []
    ingestion_mode: incremental
    alarm_exempt: false
    alarm_exempt_reason: null
    annual_rotation: false
    companion_endpoints: {}
    proxy_for: null
    retention_days: null
