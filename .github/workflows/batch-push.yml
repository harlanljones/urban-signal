name: batch-push-deploy

# Run-based/batch deployment: each run recomputes the full snapshot (grid,
# catalysts, submarkets, cell predictions) and pushes it to Workers KV, then
# deploys the edge worker. Data freshness is decoupled from code releases.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "scripts/export_dashboard.py"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/batch-push.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "scripts/export_dashboard.py"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/batch-push.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC

permissions:
  contents: read

concurrency:
  group: batch-push-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install -e "apps/api[dev]"

      - name: Generate dashboard static copy
        run: PYTHONPATH=apps/api .venv/bin/python scripts/export_dashboard.py

      - name: Check Python quality
        run: |
          .venv/bin/ruff check scripts/feed_staleness_probe.py apps/api/src/producers/watermarks.py apps/api/tests/unit/test_feed_staleness_probe.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_feed_staleness_probe.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q -m interlock apps/api/tests/unit/test_interlock_gate.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_bay_area_context.py

      - uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check web packages
        run: bun run build && bun run typecheck && bun run lint

      - name: Check dashboard zoom regressions
        run: node --test apps/dashboard/tests/grid-zoom.test.js

  snapshot-push:
    if: always() && github.event_name != 'pull_request' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # download the bay-area-context artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install project
        run: |
          uv venv .venv --python 3.12
          uv pip install -e apps/api

      # Newest weekly Bay Area context table (bay-area-context.yml). Optional:
      # without it the snapshot publishes unchanged and the dashboard simply
      # offers no Bay Area layers.
      - name: Fetch Bay Area context table
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bay-area-context.yml \
            --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name bay-area-context --dir build/context
          else
            echo "No successful bay-area-context run yet; publishing without context layers"
          fi

      - name: Build snapshot artifacts
        run: |
          mkdir -p build
          PYTHONPATH=apps/api .venv/bin/python scripts/export_dashboard.py
          /usr/bin/time -f 'elapsed_seconds=%e\npeak_rss_kib=%M' -o build/snapshot-resources.txt \
            env PYTHONPATH=apps/api .venv/bin/python -m src.export.snapshot_builder --out dist --context-dir build/context

      - name: Summarize snapshot usage
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Daily snapshot usage", "", "| Measurement | Value |", "|---|---:|"]
          resources = Path("build/snapshot-resources.txt")
          if resources.exists():
              values = dict(line.split("=", 1) for line in resources.read_text().splitlines() if "=" in line)
              if "elapsed_seconds" in values:
                  minutes = float(values["elapsed_seconds"]) / 60
                  lines.append(f"| Snapshot build minutes | {minutes:.2f} |")
                  lines.append(f"| Projected build minutes / 30 daily runs | {minutes * 30:.0f} |")
              if "peak_rss_kib" in values:
                  lines.append(f"| Peak resident memory (MiB) | {float(values['peak_rss_kib']) / 1024:.1f} |")
          bulk = Path("dist/kv-bulk.json")
          if bulk.exists():
              entries = json.loads(bulk.read_text())
              lines.append(f"| Planned KV writes per refresh | {len(entries):,} |")
              lines.append(f"| Planned KV writes / 30 daily runs | {len(entries) * 30:,} |")
              lines.append(f"| Upload payload (MiB) | {bulk.stat().st_size / 1024**2:.2f} |")
          lines += ["", "Build projections exclude setup, validation, upload, deployment, retries, and other workflow runs.",
                    "Planned writes and payload bytes do not confirm a successful upload."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Preserve snapshot resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-resources
          path: build/snapshot-resources.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: dist/
          retention-days: 7

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Push snapshot to Workers KV
        working-directory: apps/dashboard
        run: bunx wrangler kv bulk put ../../dist/kv-bulk.json --binding SNAPSHOT --remote

  deploy-dashboard:
    # Snapshot-push already gates on validate's result (incl. skipped), so gate
    # on it alone; always() is required to escape transitive skip from validate.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.snapshot-push.result == 'success'
    needs: snapshot-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Export dashboard HTML into static assets
        run: |
          uv venv .venv --python 3.12
          uv pip install -e apps/api
          PYTHONPATH=apps/api .venv/bin/python scripts/export_dashboard.py

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Deploy dashboard Worker
        working-directory: apps/dashboard
        run: bun run deploy
