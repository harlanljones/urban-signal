name: batch-push-deploy

# This workflow retains the branch-protection check name. Pushes and PRs run
# validation only; production KV writes happen on the daily schedule or an
# explicit refresh on main.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "scripts/**"
      - "src/**"
      - "packages/**"
      - "package.json"
      - "bun.lock*"
      - "turbo.json"
      - ".github/workflows/batch-push.yml"
      - ".github/workflows/dashboard-deploy.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "scripts/**"
      - "src/**"
      - "packages/**"
      - "package.json"
      - "bun.lock*"
      - "turbo.json"
      - ".github/workflows/batch-push.yml"
      - ".github/workflows/dashboard-deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: batch-push-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install -e "apps/api[dev]"

      - name: Check snapshot and interlock invariants
        run: |
          PYTHONPATH=apps/api .venv/bin/python scripts/export_dashboard.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q -m interlock apps/api/tests/unit/test_interlock_gate.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_export_snapshot.py apps/api/tests/unit/test_snapshot_metrics.py apps/api/tests/unit/test_engine_prediction_cache.py apps/api/tests/unit/test_engine_quantile_calibration.py apps/api/tests/unit/test_workflow_routing.py apps/api/tests/unit/test_validate_national_artifact.py apps/api/tests/unit/test_prune_snapshot_releases.py

      - name: Check Python quality and feed behavior
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          .venv/bin/ruff check scripts/feed_staleness_probe.py apps/api/src/producers/watermarks.py apps/api/tests/unit/test_feed_staleness_probe.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_feed_staleness_probe.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_bay_area_context.py

      - name: Check durable shadow ingestion
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          .venv/bin/ruff check apps/api/src/ingestion scripts/run_shadow_ingestion.py scripts/probe_ingestion_store.py scripts/validate_shadow_cycles.py apps/api/tests/unit/test_ingestion_*.py apps/api/tests/unit/test_shadow_*.py
          PYTHONPATH=apps/api .venv/bin/python -m pytest -q apps/api/tests/unit/test_ingestion_*.py apps/api/tests/unit/test_shadow_*.py

      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'push' || github.event_name == 'pull_request'

      - name: Install JavaScript dependencies
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Check web packages
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bun run build && bun run typecheck && bun run lint

      - name: Check dashboard zoom regressions
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bun run --cwd apps/dashboard test && node --test apps/dashboard/tests/grid-zoom.test.js

  snapshot-push:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # download the bay-area-context and national artifacts
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install project
        run: |
          uv venv .venv --python 3.12
          uv pip install -e apps/api

      # The weekly context artifact is optional. Record absence or its source
      # run time so a successful refresh summary makes the fallback explicit.
      - name: Fetch Bay Area context table
        id: bay-area-context
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/context
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bay-area-context.yml \
            --branch main --status success --limit 1 --json databaseId,createdAt \
            --jq '.[0] | [.databaseId, .createdAt] | @tsv')
          run_id=$(printf '%s' "$result" | cut -f1)
          created_at=$(printf '%s' "$result" | cut -f2)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful bay-area-context run found; continuing without optional context layers."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "created_at=" >> "$GITHUB_OUTPUT"
          elif gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name bay-area-context --dir build/context; then
            echo "Downloaded context artifact from run $run_id created at $created_at."
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          else
            echo "Context artifact from run $run_id could not be downloaded; continuing without optional context layers."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          fi

      # The national LODES context artifact is required in production mode
      # (US-435 §24). It is built monthly by national-publish.yml; the daily path
      # never downloads raw LODES. A missing artifact fails the daily build
      # instead of silently regressing to metro-only coverage.
      - name: Fetch national context artifact
        id: national-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/national
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow national-publish.yml \
            --branch main --status success --limit 1 --json databaseId,createdAt \
            --jq '.[0] | [.databaseId, .createdAt] | @tsv')
          run_id=$(printf '%s' "$result" | cut -f1)
          created_at=$(printf '%s' "$result" | cut -f2)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful national-publish run found; require-national production mode cannot proceed." >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name national-artifact --dir build/national
          echo "Downloaded national artifact from run $run_id created at $created_at."
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Validate national context artifact
        run: |
          PYTHONPATH=apps/api .venv/bin/python scripts/validate_national_artifact.py \
            --dir build/national

      - name: Restore deterministic model bundle
        uses: actions/cache@v4
        with:
          path: build/model-bundles
          key: snapshot-model-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('apps/api/constraints/snapshot-models.txt', 'apps/api/src/models/bundle.py', 'apps/api/src/models/dcn_v2.py', 'apps/api/src/models/st_gnn.py', 'apps/api/src/models/quantile_lgbm.py', 'apps/api/src/models/export_onnx.py', 'apps/api/src/serving/engine.py') }}

      - name: Build snapshot artifacts and metrics
        run: |
          mkdir -p build
          PYTHONPATH=apps/api .venv/bin/python scripts/export_dashboard.py
          bundle=$(PYTHONPATH=apps/api .venv/bin/python -c "from pathlib import Path; from src.models.bundle import ensure_synthetic_bundle; print(ensure_synthetic_bundle(Path('build/model-bundles')))")
          # Dense metro hex (US-408: bounded k_ring=3 + 1.5 km) and require-national
          # production mode (US-435 §24). national-dir's parent carries the
          # national/ tree the fetch step downloaded. The bundle is the seeded
          # synthetic baseline; --no-prediction-cache remains the inference rollback.
          /usr/bin/time -f 'elapsed_seconds=%e\npeak_rss_kib=%M' -o build/snapshot-resources.txt \
            env PYTHONPATH=apps/api .venv/bin/python -m src.export.snapshot_builder \
              --out dist --context-dir build/context --metrics-out build/snapshot-metrics.json \
              --dense-metro --national-dir build --require-national \
              --model-bundle "$bundle"

      - name: Preserve snapshot metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-metrics
          path: |
            build/snapshot-metrics.json
            build/snapshot-resources.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve snapshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: dist/
          retention-days: 7

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Push snapshot to Workers KV
        working-directory: apps/dashboard
        run: bunx wrangler kv bulk put ../../dist/kv-bulk.json --binding SNAPSHOT --remote

      # Compatible reader ships in dashboard-deploy before this scheduled job
      # switches snapshot/current to the content-addressed release. Legacy
      # logical keys and stage-B twins stay in kv-bulk.json for rollback.
      - name: Publish content-addressed snapshot objects
        working-directory: apps/dashboard
        run: |
          PYTHONPATH=../.. ../../.venv/bin/python ../../scripts/publish_snapshot.py \
            --plan ../../dist/publication-plan.json \
            --bulk ../../dist/kv-bulk.json \
            --publish \
            --out ../../dist/kv-versioned.json
          bunx wrangler kv bulk put ../../dist/kv-versioned.json --binding SNAPSHOT --remote

      # Stage B publishes a release-qualified twin of every key. Keep only the
      # generations the reader can address (the new current + its previous
      # rollback) so the namespace does not grow by a full snapshot every day.
      - name: Prune stale snapshot generations
        env:
          SNAPSHOT_NAMESPACE_ID: ${{ vars.SNAPSHOT_NAMESPACE_ID || 'cea91d937ff344bf9ae70f62734f5ae5' }}
        run: |
          PYTHONPATH=apps/api .venv/bin/python scripts/prune_snapshot_releases.py \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --namespace-id "$SNAPSHOT_NAMESPACE_ID" \
            --pointer dist/kv-bulk.json

      - name: Summarize successful snapshot publication
        if: success()
        env:
          BAY_AREA_CONTEXT_AVAILABLE: ${{ steps.bay-area-context.outputs.available }}
          BAY_AREA_CONTEXT_CREATED_AT: ${{ steps.bay-area-context.outputs.created_at }}
          NATIONAL_ARTIFACT_CREATED_AT: ${{ steps.national-artifact.outputs.created_at }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          bulk_path = Path("dist/kv-bulk.json")
          planned = len(json.loads(bulk_path.read_text()))
          lines = [
              "## Daily snapshot publication",
              "",
              "| Measurement | Value |",
              "|---|---:|",
              f"| Planned KV writes | {planned:,} |",
              f"| Successful KV writes | {planned:,} |",
              f"| Upload payload (MiB) | {bulk_path.stat().st_size / 1024**2:.2f} |",
          ]
          created_at = os.environ.get("BAY_AREA_CONTEXT_CREATED_AT", "")
          if os.environ.get("BAY_AREA_CONTEXT_AVAILABLE") == "true":
              source_time = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              age_hours = (datetime.now(timezone.utc) - source_time).total_seconds() / 3600
              lines.append(f"| Optional Bay Area context artifact age | {age_hours:.1f} hours |")
          elif created_at:
              lines.append("| Optional Bay Area context | Artifact unavailable; snapshot has no optional context layers |")
          else:
              lines.append("| Optional Bay Area context | No successful context run found; snapshot has no optional context layers |")
          national_created = os.environ.get("NATIONAL_ARTIFACT_CREATED_AT", "")
          if national_created:
              national_time = datetime.fromisoformat(national_created.replace("Z", "+00:00"))
              national_age = (datetime.now(timezone.utc) - national_time).total_seconds() / 3600
              lines.append(f"| National LODES artifact age | {national_age:.1f} hours |")
          else:
              lines.append("| National LODES artifact | Consumed in require-national mode (age not recorded) |")
          resources = Path("build/snapshot-resources.txt")
          if resources.exists():
              values = dict(line.split("=", 1) for line in resources.read_text().splitlines() if "=" in line)
              if "elapsed_seconds" in values:
                  minutes = float(values["elapsed_seconds"]) / 60
                  lines.extend([
                      f"| Snapshot build minutes | {minutes:.2f} |",
                      f"| Projected build minutes / 30 daily runs | {minutes * 30:.0f} |",
                  ])
              if "peak_rss_kib" in values:
                  lines.append(f"| Peak resident memory (MiB) | {float(values['peak_rss_kib']) / 1024:.1f} |")
          metrics = Path("build/snapshot-metrics.json")
          if metrics.exists():
              data = json.loads(metrics.read_text())
              lines.append(f"| Snapshot metrics schema | {data.get('schema_version', 'unknown')} |")
          lines.extend([
              "",
              "Build projections exclude setup, validation, upload, deployment, retries, and other workflow runs.",
              "Successful write count is reported only after Wrangler exits successfully.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
