apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-signal-inference-service
  namespace: ml-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urban-signal-inference-service
  template:
    metadata:
      labels:
        app: urban-signal-inference-service
        spec:
          env:
            - name: PYTHONPATH
              value: /app/apps/api
          containers:
        - name: inference-api
          image: ghcr.io/harlan/urban-signal-api:latest
          command: ["uvicorn", "src.serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ONNX_EXECUTION_PROVIDER
              value: "CUDAExecutionProvider"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: urban-signal-inference-service
  namespace: ml-inference
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: urban-signal-inference-service
