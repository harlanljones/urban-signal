                  - paragraph [ref=f2e62]: Help keep Oklahoma City safe and well-maintained by reporting non-emergency code violations, such as high weeds, abandoned vehicles and other neighborhood concerns. Your vigilance and participation are invaluable in maintaining the quality of our community.
                  - heading "Ways to Report" [level=3] [ref=f2e63]
