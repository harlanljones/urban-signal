                  - paragraph [ref=f2e77]:
                    - strong [ref=f2e78]: Emergency Situations
                    - text: ": For police or public safety emergencies, dial 9-1-1. For water or sewer emergencies, call (405) 297-3334."
                  - paragraph [ref=f2e79]:
                    - strong [ref=f2e80]: Investigation and Resolution
                    - text: ": All concerns will be investigated, but resolution times may vary depending on the nature of the violation. Immediate results may not always be visible."
