      - generic [ref=f4e38]:
        - heading "Data (Records) API" [level=1] [ref=f4e39]
        - paragraph [ref=f4e40]: Provides access to data record information in either XML or JSON format. If no dataset (id) is provided, an array of available datasets is returned. This API supports both HTTP Get and Post methods.
        - paragraph [ref=f4e41]: "* HTTP Get provides simple record access of entire dataset or a single record."
        - paragraph [ref=f4e42]: "* HTTP Post supports all of HTTP Get options and also provides additional query options for sorting, attribute queries, and spatial queries. When using HTTP Post the request body should be submitted as a JSON object, with the content-type header set to text/json."
